# Publishes to npm with provenance when a version tag is pushed.
# n8n verified community nodes must be published from GitHub Actions with a provenance
# statement (required from 2026-05-01). Configure npm Trusted Publishing for this repository
# and workflow file name (publish.yml), or store a granular token as NPM_TOKEN.
name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
